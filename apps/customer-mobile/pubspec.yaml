name: typease_customer
description: "TypEase customer mobile application. Tenant branding is resolved at runtime (white label)."
publish_to: "none"
version: 1.0.0+1

# NOTE: this project has not been compiled. Versions below are conservative pins that were
# stable when the code was written; re-resolve them on a machine with Flutter installed
# (see README.md, "Packages").
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations; "any" lets the SDK choose the matching version.
  intl: any

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  app_links: ^6.3.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  app_settings: ^5.1.1
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/brand/
  # Bundled so the first launch looks right offline. Both under the SIL Open Font License (assets/fonts/OFL-*.txt).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
